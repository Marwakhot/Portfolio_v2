<!doctype html>
<html lang="en" class="is-boarding">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marwa Khot</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <section class="gate is-intro" aria-label="Boarding gate">
      <h2 class="welcome-text"></h2>
      <canvas class="gate-canvas" aria-label="A boarding pass above a card reader. Drag the pass through the slot to enter."></canvas>
      <p class="gate-hint shimmer"></p>
      <button class="gate-skip" type="button">Skip</button>
    </section>

    <div class="sky" aria-hidden="true">
      <div class="sky-photo"></div>
      <div class="cloud-layer"><div class="cloud-drift"></div></div>
      <div class="cloud-layer"><div class="cloud-drift"></div></div>
      <div class="cloud-layer"><div class="cloud-drift"></div></div>
    </div>

    <main inert>
      <div class="cabin-run" aria-hidden="true">
        <div class="cabin">
          <div class="jet-stage">
            <div class="jet">
              <img src="/jet/hero-back.webp" alt="" />
              <div class="jet-window">
                <div class="jet-window-c">
                  <div class="jet-lift">
                    <div class="jet-shade"></div>
                    <img class="jet-knob" src="/jet/window-knob.webp" alt="" />
                    <img class="jet-knob" src="/jet/window-knob-2.webp" alt="" />
                  </div>
                </div>
              </div>
              <img src="/jet/hero-front.webp" alt="" />
              <img src="/jet/hero-front-over.webp" alt="" />
            </div>
            <div class="jet-overlay"></div>
          </div>
          <div class="cabin-copy"><p class="cruising-left"></p><p class="cruising-right"></p></div>
        </div>
      </div>

      <div class="sky-fade" aria-hidden="true"><div class="cloud-bank"></div></div>

      <div class="card-run">
      <div class="badge-rail"><div class="badge"><canvas></canvas></div></div>

      <section class="hero" aria-label="Introduction">
        <p class="intro"></p>
        <p class="education"></p>
        <h1><span class="first"></span> <span class="last"></span></h1>
        <div class="mobile-copy">
          <p class="lead"></p>
          <p class="meta"></p>
        </div>
      </section>

      <section class="journey" aria-label="Experience" hidden></section>
      </div>

      <section class="events" aria-label="Hackathons and events" hidden></section>

      <section class="projects" aria-label="Projects" hidden></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
